# 仅记录 DESIGN.md / WORKFLOW.md 已冻结或明确决定的项目值。
project:
  name: shopping-agent-rl
  model: Qwen3-8B
  catalog: Catalog-Fine
  seed: 1
  max_action_steps: 30
  scenarios:
    - single
    - single_persona
  actual_dataset_counts:
    single:
      train: 21962
      test: 1459
    single_persona:
      train: 3323
      test: 1343

sft:
  successful_trajectories_per_scenario: 6000
  unique_tasks_per_scenario: 3000
  target_successful_demos_per_task: 2

grpo:
  group_size: 8
  task_groups_per_update: 32
  updates: 200
  max_context: 32768
  kl_penalty: false

reward:
  main_endpoint: strict
  optional_paper_endpoint: loose
