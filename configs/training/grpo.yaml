# Composed with Round B runtime defaults; no mutation of SFT/eval defaults.
mode: grpo
init: base
reward_alpha: 1.0
endpoint: http://127.0.0.1:5500
train_task_manifest: null
sft_run_dir: null
grpo:
  loss_type: grpo
  num_generations: 8
  beta: 0.0
  scale_rewards: group
  learning_rate: 1.0e-6
  task_groups_per_update: 32
  max_steps: 200
  per_device_train_batch_size: null  # GPU-PREFLIGHT; accumulation derived from G * groups.
  lora_r: null
  lora_alpha: null
  target_modules: null
  save_steps: 10
  logging_steps: 1
sampling:
  chat_template_kwargs:
    enable_thinking: false
  do_sample: true
  temperature: 1.0  # Initial project choice, not an optimized/frozen GPU setting.
  top_p: 1.0
  max_new_tokens: 512
  max_context_tokens: 32768
